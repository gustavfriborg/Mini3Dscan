name: Mini3DScan
options:
  bundleIdPrefix: dk.friborg
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  SWIFT_STRICT_CONCURRENCY: minimal
  SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  TARGETED_DEVICE_FAMILY: "1,2"
  SDKROOT: iphoneos
  SUPPORTED_PLATFORMS: iphoneos
  SUPPORTS_MACCATALYST: NO
  SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  CODE_SIGNING_ALLOWED: NO
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: ""
  CODE_SIGN_ENTITLEMENTS: ""
  DEVELOPMENT_TEAM: ""
  PROVISIONING_PROFILE_SPECIFIER: ""
  ENABLE_BITCODE: NO
  VALIDATE_PRODUCT: NO
  GENERATE_INFOPLIST_FILE: NO
targets:
  Mini3DScan:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mini3DScan
        excludes:
          - Info.plist
    info:
      path: Mini3DScan/Info.plist
      properties:
        CFBundleDisplayName: Mini3DScan
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: "Mini3DScan bruger kameraet og LiDAR-scanneren til at opbygge en 3D-model af rummet."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dk.friborg.mini3dscan
      PRODUCT_NAME: Mini3DScan
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: ""
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: ""
      CODE_SIGN_ENTITLEMENTS: ""
      DEVELOPMENT_TEAM: ""
      PROVISIONING_PROFILE_SPECIFIER: ""
      ENABLE_BITCODE: NO
      VALIDATE_PRODUCT: NO
      ARCHS: arm64
      ONLY_ACTIVE_ARCH: NO
schemes:
  Mini3DScan:
    build:
      targets:
        Mini3DScan: all
    run:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
